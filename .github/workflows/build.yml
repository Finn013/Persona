name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Keystore
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > app/release.p12; fi
      - name: Build (Fulguris-based, F-Droid flavor, release)
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleSlionsFullFdroidRelease
      - name: Collect APK
        run: |
          ls -R app/build/outputs/apk
          cp "$(find app/build/outputs/apk -name '*.apk' | head -n1)" Persona.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Persona-apk
          path: Persona.apk
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" Persona.apk --clobber
